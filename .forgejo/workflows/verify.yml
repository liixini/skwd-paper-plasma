name: verify

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: paper-plasma-verify-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Forgejo / Paper Plasma x86_64-linux required
    runs-on: skwd-paper-ci
    timeout-minutes: 20
    env:
      TMPDIR: /var/tmp/skwd-plasma-tmp-${{ github.run_id }}-${{ github.run_attempt }}
      TMP: /var/tmp/skwd-plasma-tmp-${{ github.run_id }}-${{ github.run_attempt }}
      TEMP: /var/tmp/skwd-plasma-tmp-${{ github.run_id }}-${{ github.run_attempt }}
      RUNNER_TEMP: /var/tmp/skwd-plasma-tmp-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Prepare temporary storage
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          test "$TMP" = "$TMPDIR"
          test "$TEMP" = "$TMPDIR"
          test "$RUNNER_TEMP" = "$TMPDIR"
          scratch_fstype=$(findmnt -n -o FSTYPE -T "$TMPDIR")
          case "$scratch_fstype" in
            ""|tmpfs|ramfs) exit 1 ;;
          esac
          findmnt -T "$TMPDIR"
          df -h "$TMPDIR"

      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build and verify the package stage
        run: scripts/test-all.sh
